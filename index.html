<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotherTalk — Learn African Languages Through Stories</title>
<meta name="description" content="A story-driven platform for learning indigenous African languages.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand" id="brand-home">MotherTalk</div>
  <div class="points" id="points-badge" title="Your learning points">0 pts</div>
</header>

<main id="app">

  <!-- HOME: story catalogue -->
  <section id="view-home" class="view">
    <div class="hero">
      <h1>Learn a language by living a story.</h1>
      <p>Pick a story, meet its characters, hear real phrases, and test yourself as you go.</p>
    </div>
    <div id="story-grid" class="story-grid"></div>
    <p class="note">Progress is saved on this device.</p>
  </section>

  <!-- PLAYER: visual novel scene -->
  <section id="view-player" class="view" hidden>
    <button class="back" id="btn-quit">&larr; Stories</button>
    <div class="scene-card">
      <div class="scene-art" id="scene-art"></div>
      <div class="scene-body">
        <div class="character" id="scene-character"></div>
        <p class="native" id="scene-native"></p>
        <button class="hear" id="btn-hear">Hear pronunciation</button>
        <p class="translation" id="scene-translation"></p>
        <div class="culture" id="scene-culture"></div>
        <div id="reply-box" class="reply" hidden></div>
        <div id="choices" class="choices"></div>
        <button class="primary" id="btn-continue" hidden>Continue &rarr;</button>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="view-quiz" class="view" hidden>
    <div class="quiz-card">
      <div class="quiz-progress" id="quiz-progress"></div>
      <h2 id="quiz-question"></h2>
      <div id="quiz-options" class="choices"></div>
      <div id="quiz-feedback" class="reply" hidden></div>
      <button class="primary" id="btn-quiz-next" hidden>Next &rarr;</button>
    </div>
  </section>

  <!-- STORY COMPLETE -->
  <section id="view-done" class="view" hidden>
    <div class="done-card">
      <h2>Story complete!</h2>
      <p id="done-summary"></p>
      <p class="points-earned" id="done-points"></p>
      <button class="primary" id="btn-done-home">Back to stories</button>
    </div>
  </section>

</main>

<footer class="footer">
  <p>MotherTalk — your voice, your ideas, our journey.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
