{% extends "base.html" %}
{% block content %}
<div class="hero">
  <img src="{{ url_for('static', filename='img/logo.png') }}" alt="MotherTalk logo">
  <h1>Join MotherTalk</h1>
  <p>One account, many stories, many languages.</p>
</div>
<form method="post" class="auth">
  <label>Username <input name="username" required autocomplete="username"></label>
  <label>Password <input type="password" name="password" required autocomplete="new-password"></label>
  <button type="submit">Create account</button>
</form>
<p style="text-align:center">Have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
