{% extends "base.html" %}
{% block content %}
<div class="hero">
  <img src="{{ url_for('static', filename='img/logo.png') }}" alt="MotherTalk logo">
  <h1>MotherTalk</h1>
  <p>Learn indigenous African languages through stories.</p>
</div>
<form method="post" class="auth">
  <label>Username <input name="username" required autocomplete="username"></label>
  <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
  <button type="submit">Log in</button>
</form>
<p style="text-align:center">No account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
{% endblock %}
